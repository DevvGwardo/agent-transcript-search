[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-transcript-search"
version = "0.1.0"
description = "One FTS index across Claude Code, Hermes, Cursor, and Codex session logs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "DevGwardo" }]
keywords = ["agent", "claude-code", "hermes", "cursor", "codex", "search", "fts", "transcript"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Documentation",
]

[project.scripts]
ats = "agent_transcript_search.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
